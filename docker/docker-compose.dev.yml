version: '3.8'

services:
  neocoin-node-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ..:/app
    ports:
      - "8080:8080"
      - "3030:3030"
    environment:
      - DEBUG=true
      - LOG_LEVEL=debug
    command: ["air", "-c", ".air.toml", "-b", "8080", "-p", "3030"]