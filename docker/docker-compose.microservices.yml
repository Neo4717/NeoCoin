version: '3.8'

services:
  neocoin-core:
    build: ./docker
    command: ./neocoin node
    volumes:
      - ./data:/data
    ports:
      - "9090:9090"
    environment:
      - CHAIN_ID=1
      - NODE_PORT=8080
      - P2P_PORT=9090
      - LOG_LEVEL=info

  neocoin-api:
    build: ./docker
    command: ./neocoin api
    depends_on:
      - neocoin-core
    ports:
      - "8080:8080"
    environment:
      - CHAIN_ID=1
      - NODE_PORT=8080
      - LOG_LEVEL=info

  neocoin-p2p:
    build: ./docker
    command: ./neocoin p2p
    depends_on:
      - neocoin-core
    ports:
      - "9091:9091"
    environment:
      - CHAIN_ID=1
      - P2P_PORT=9091
      - P2P_SEEDS=seed1:9091,seed2:9091
      - LOG_LEVEL=info

  neocoin-miner:
    build: ./docker
    command: ./neocoin miner
    depends_on:
      - neocoin-core
    environment:
      - CHAIN_ID=1
      - MINER_ADDRESS=NEOxxx
      - AUTO_MINE=true
      - LOG_LEVEL=info
