version: '3.8'

services:
  node1:
    build: 
      context: .
      dockerfile: docker/Dockerfile
    command: ./neocoin
    ports:
      - "8081:8080"
    environment:
      - NODE_PORT=8080
      - P2P_PORT=9091
      - P2P_ENABLE=true
      - P2P_SEEDS=node2:9092
      - GENESIS_PATH=/genesis/smoke.json
      - CHAIN_ID=3
      - STORE_MODE=pruned
      - LOG_LEVEL=info
      - METRICS_ENABLED=true
      - ENABLE_PROTOBUF=true
    volumes:
      - ./genesis/smoke.json:/genesis/smoke.json:ro
      - node1_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/chain/info"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - testnet

  node2:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ./neocoin
    ports:
      - "8082:8080"
    environment:
      - NODE_PORT=8080
      - P2P_PORT=9092
      - P2P_ENABLE=true
      - P2P_SEEDS=node1:9091
      - GENESIS_PATH=/genesis/smoke.json
      - CHAIN_ID=3
      - STORE_MODE=pruned
      - LOG_LEVEL=info
      - METRICS_ENABLED=true
      - ENABLE_PROTOBUF=true
    volumes:
      - ./genesis/smoke.json:/genesis/smoke.json:ro
      - node2_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/chain/info"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - testnet

volumes:
  node1_data:
  node2_data:

networks:
  testnet:
    driver: bridge
