name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.23'
  GOFLAGS: '-trimpath'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          
      - name: Check formatting
        run: |
          go fmt ./...
          git diff --exit-code
          
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
          
      - name: Check go.mod
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          
      - name: Download dependencies
        run: go mod download
        
      - name: Run unit tests
        run: |
          go test -v -race -coverprofile=coverage.out \
            -covermode=atomic \
            -timeout=10m \
            ./...
            
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage.out
          fail_ci_if_error: false
          
      - name: Run tests with race detector
        run: |
          go test -race -timeout=5m ./... || true

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          
      - name: Run Gosec security scanner
        uses: securego/gosec-action@master
        with:
          args: '-no-fail -fmt sarif -out gosec-results.sarif ./...'
          
      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec-results.sarif

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          
      - name: Run fuzz tests (2 minutes per target)
        run: |
          timeout 120 go test -fuzz=FuzzHashFunctions -fuzztime=60s ./internal/crypto/ 2>/dev/null || true
          timeout 120 go test -fuzz=FuzzSignatureVerification -fuzztime=60s ./internal/crypto/ 2>/dev/null || true
          timeout 120 go test -fuzz=FuzzTransactionValidation -fuzztime=60s ./internal/blockchain/ 2>/dev/null || true
          timeout 120 go test -fuzz=FuzzDifficultyAdjustment -fuzztime=60s ./internal/consensus/ 2>/dev/null || true

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
            
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          dockerfile: docker/Dockerfile
          push: false
          load: true
          tags: neocoin:test
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          
      - name: Run smoke test
        run: |
          docker run -d --name neocoin-test -p 127.0.0.1:8080:8080 neocoin:test
          sleep 5
          curl -f http://127.0.0.1:8080/chain/info || exit 1
          docker stop neocoin-test

  cross-compile:
    name: Cross-compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          GOFLAGS='-trimpath' go build -ldflags="-s -w" \
            -o dist/neocoin-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/node/
            
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neocoin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/neocoin-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 7

  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          
      - name: Run integration tests
        run: |
          chmod +x tests/integration/test.sh
          ./tests/integration/test.sh
          
      - name: Upload integration test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: tests/integration/*.log
          retention-days: 7

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          
      - name: Run benchmarks
        run: |
          go test -bench=. -benchmem -run=^$ \
            -timeout=10m ./internal/blockchain/... \
            | tee benchmark.txt
          
      - name: Comment benchmark results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('benchmark.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Benchmark Results\n```\n' + content + '\n```'
            });