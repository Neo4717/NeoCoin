name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

env:
  GO_VERSION: '1.21'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.21', '1.22']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: blockchain/go.sum
          
      - name: Build
        run: |
          cd blockchain
          go build -o blockchain .
          
      - name: Format check
        run: |
          cd blockchain
          gofmt -d .
          
      - name: Vet
        run: |
          cd blockchain
          go vet ./...
          
      - name: Test
        run: |
          cd blockchain
          go test -v -race -coverprofile=coverage.out ./...
          
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.go }}
          path: blockchain/coverage.out

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: blockchain/go.sum
          
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m ./blockchain/...

  docker:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: |
          docker compose -f docker-compose.public.yml build
          
      - name: Test container runs
        run: |
          docker compose -f docker-compose.public.yml up -d
          sleep 5
          docker compose -f docker-compose.public.yml ps
          docker compose -f docker-compose.public.yml down

  smoke-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: |
          docker compose -f docker-compose.smoke.yml build
          
      - name: Run smoke test
        run: |
          docker compose -f docker-compose.smoke.yml up --abort-on-container-exit
          
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: .smoke-data/

  security:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Gosec
        uses: securego/gosec@master
        with:
          args: '-no-fail -stdout ./blockchain/...'
          
  build-release:
    needs: [test, lint, docker, smoke-test, security]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          
      - name: Build
        run: |
          cd blockchain
          go build -ldflags="-s -w" -o neocoin .
          
      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          files: blockchain/neocoin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}