name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          
      - name: Run all tests
        run: go test -race ./...
        
      - name: Build
        run: |
          GOFLAGS='-trimpath' go build -ldflags="-s -w" ./cmd/node/...
          
      - name: Build Docker images
        run: |
          docker build -t neocoin:${{ github.ref_name }} -t neocoin:latest -f docker/Dockerfile .
          
      - name: Generate checksums
        run: |
          sha256sum neocoin | tee SHA256SUMS
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            neocoin
            SHA256SUMS
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker push neocoin:${{ github.ref_name }}
          docker push neocoin:latest