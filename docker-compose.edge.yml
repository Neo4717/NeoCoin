services:
  blockchain:
    ports: []
    expose:
      - "8080"
    labels:
      - "neocoin.role=node"

  edge-proxy:
    image: caddy:2-alpine
    depends_on:
      blockchain:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"
      - "127.0.0.1:8443:443"
      - "127.0.0.1:9090:9090"
    volumes:
      - ./edge/Caddyfile:/etc/caddy/Caddyfile:ro
      - neocoin_caddy_data:/data
      - neocoin_caddy_config:/config
    restart: always
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "neocoin.role=edge-proxy"
      - "neocoin.version=1.0"

volumes:
  neocoin_caddy_data:
  neocoin_caddy_config: